; The view models moved out of their domain modules, first into RtsProxy (where they were allowed
; to know every domain at once and read across them, e.g. a character's nation name), then when the
; per-entity proxy layer was removed RtsProxy was renamed RtsViewModels to match, and finally
; RtsViewModels was folded entirely into RtsUI (there is no longer a separate pure-derivation
; module — see CLAUDE.md). Redirects point straight at the final module so old assets do not need
; to hop through RtsProxy/RtsViewModels. Only the module part of the path ever changed; class and
; property names are untouched.
